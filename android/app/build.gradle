apply plugin: 'com.android.application'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('key.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    def fileValue = releaseSigningProperties.getProperty(propertyName)
    if (fileValue != null && fileValue.trim()) {
        return fileValue.trim()
    }
    def environmentValue = System.getenv(environmentName)
    return environmentValue != null && environmentValue.trim() ? environmentValue.trim() : null
}

def releaseStoreFilePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def releaseStoreFile = releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null

def releaseSigningInputsPresent = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && it.toString().trim() }

def releaseSigningAvailable = releaseSigningInputsPresent &&
        releaseStoreFile != null &&
        releaseStoreFile.isFile()

def requireReleaseSigning = project.hasProperty('requireReleaseSigning') &&
        project.property('requireReleaseSigning').toString().toBoolean()

if (releaseSigningAvailable) {
    signingConfigs {
        release {
            storeFile releaseStoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
} else if (requireReleaseSigning) {
    def missing = []
    if (!releaseStoreFilePath) missing << 'keystore path (storeFile / ANDROID_KEYSTORE_PATH)'
    if (!releaseStorePassword) missing << 'store password (storePassword / ANDROID_KEYSTORE_PASSWORD)'
    if (!releaseKeyAlias) missing << 'key alias (keyAlias / ANDROID_KEY_ALIAS)'
    if (!releaseKeyPassword) missing << 'key password (keyPassword / ANDROID_KEY_PASSWORD)'
    if (releaseStoreFilePath && !rootProject.file(releaseStoreFilePath).isFile()) {
        missing << 'configured keystore file is not readable: ' + rootProject.file(releaseStoreFilePath).absolutePath
    }
    throw new GradleException(
        "Release signing is required but unavailable. Configure android/key.properties locally " +
        "or ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in CI. " +
        "Missing: " + missing.join(', ') + "."
    )
} else {
    logger.lifecycle(
        "Release signing credentials not found. Local release bundles may be generated unsigned for validation. " +
        "Use -PrequireReleaseSigning=true (the production npm release script does this) to enforce signing."
    )
}

android {
    namespace "in.nilanga.moneymatters"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.nilanga.moneymatters"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 1.4.1 encoded as major*10000 + minor*100 + patch.
        versionCode 10401
        versionName "1.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
