openapi: 3.1.0
info:
  title: Invoice Automation SaaS API
  version: 1.4.0
  description: |
    Public operational and receipt-delivery HTTP surface for Invoice Automation SaaS.
    Financial writes remain protected by the application's existing authentication,
    authorization, Supabase RLS, and transactional database boundaries.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Application process is responsive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      responses:
        '200':
          description: Required database dependency is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Required database dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnhealthyResponse'
  /api/receipts/pdf:
    get:
      operationId: getReceiptPdf
      summary: Retrieve a receipt PDF
      description: |
        Retrieves a receipt PDF using a time-limited access token. The token is
        validated before database access. Public access is rate-limited.
      parameters:
        - name: token
          in: query
          required: true
          description: Time-limited receipt access token.
          schema:
            type: string
            minLength: 32
            maxLength: 512
      responses:
        '200':
          description: Receipt PDF.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Receipt access token is invalid, revoked, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Sanitized unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  headers:
    XRateLimitLimit:
      description: Maximum requests permitted in the current rate-limit window.
      schema:
        type: integer
        minimum: 1
    XRateLimitRemaining:
      description: Remaining requests in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: healthy
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: connected
    UnhealthyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: unhealthy
        database:
          type: string
          const: disconnected
    ErrorDetail:
      type: object
      additionalProperties: true
    ErrorObject:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorObject'
