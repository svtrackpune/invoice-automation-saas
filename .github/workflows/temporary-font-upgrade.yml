name: Apply professional document fonts

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update-font-options:
    if: github.event.pull_request.head.ref == 'fix/professional-document-fonts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-document-fonts
          fetch-depth: 0
      - name: Add professional document fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/next-workspace/brand/UnifiedDocumentSettings.tsx')
          text = path.read_text()
          old = '<option>Inter</option><option>Arial</option><option>Roboto</option><option>Georgia</option>'
          new = '<option value="Inter">Inter — Modern</option><option value="Roboto">Roboto — Clean</option><option value="Open Sans">Open Sans — Friendly</option><option value="Lato">Lato — Professional</option><option value="Montserrat">Montserrat — Strong</option><option value="Poppins">Poppins — Contemporary</option><option value="Source Sans 3">Source Sans 3 — Business</option><option value="Merriweather">Merriweather — Premium</option><option value="Georgia">Georgia — Classic</option><option value="Arial">Arial — Standard</option>'
          if old not in text:
              raise SystemExit('Expected font option block was not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/next-workspace/brand/UnifiedDocumentSettings.tsx
          git commit -m 'feat: add professional document fonts' || true
          git push origin HEAD:fix/professional-document-fonts
          rm -f .github/workflows/temporary-font-upgrade.yml
          git add .github/workflows/temporary-font-upgrade.yml
          git commit -m 'chore: remove temporary font upgrade workflow' || true
          git push origin HEAD:fix/professional-document-fonts
