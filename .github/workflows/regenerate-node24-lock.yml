name: Regenerate lockfile for Plesk Node 24

on:
  push:
    branches:
      - plesk-node24-compat-20261002

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile with target Node/npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install validation
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Financial invariants
        run: npm run test:financial

      - name: Correction contract tests
        run: node --test tests/correction-contract.test.mjs

      - name: Receipt delivery contract tests
        run: node --test tests/receipt-delivery-contract.test.mjs

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already compatible with target Node/npm."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for Node 24"
          git push
