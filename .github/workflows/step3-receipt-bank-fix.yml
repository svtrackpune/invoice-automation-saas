name: Step 3 receipt bank patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'step3-receipt:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch receipt renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/next-workspace/documents/DocumentViewer.tsx')
          s=p.read_text()
          old='<div className="payment-detail"><span>Payment method</span><strong>{text(payload.payment_method || payload.method || \'—\')}</strong>{(payload.payment_reference || payload.reference) && <><span>Reference</span><strong>{text(payload.payment_reference || payload.reference)}</strong></>}</div>\n    <div className="paid-stamp">PAID</div>'
          new='<div className="payment-detail"><span>Payment method</span><strong>{text(payload.payment_method || payload.method || \'—\')}</strong>{(payload.payment_reference || payload.reference) && <><span>Reference</span><strong>{text(payload.payment_reference || payload.reference)}</strong></>}</div>{paymentSelection?.bank && <PaymentSection paymentMode="bank" paymentLink="" paymentSelection={paymentSelection} balance={balance} currency={payload.currency_code} />}\n    <div className="paid-stamp">PAID</div>'
          if old not in s: raise SystemExit('receipt payment anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit receipt fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/next-workspace/documents/DocumentViewer.tsx
          git commit -m 'fix: render selected bank details on receipts'
          git push
