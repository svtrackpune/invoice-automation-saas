name: One-time print parties fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-print-parties:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply root print viewport fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/next-workspace/documents/DocumentViewer.tsx')
          source = path.read_text(encoding='utf-8')
          old = "frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;'"
          new = "frame.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;visibility:hidden;'"
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one print iframe style, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Verify root fix and build
        shell: bash
        run: |
          grep -n "left:-10000px;top:0;width:794px;height:1123px" app/next-workspace/documents/DocumentViewer.tsx
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-print-parties-fix.yml
          git add app/next-workspace/documents/DocumentViewer.tsx .github/workflows/one-time-print-parties-fix.yml
          git diff --cached --check
          git commit -m "fix: use real print viewport for document layout"
          git push