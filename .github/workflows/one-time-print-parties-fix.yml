name: One-time print parties fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-print-parties:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply surgical print layout fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/next-workspace/documents/DocumentViewer.tsx')
          source = path.read_text(encoding='utf-8')
          old = '@page{size:A4;margin:0}html,body{margin:0;padding:0;background:#fff}.page{padding:0!important;background:#fff!important}.paper{margin:0!important;box-shadow:none!important}'
          new = '@page{size:A4;margin:0}html,body{margin:0;padding:0;background:#fff}.page{padding:0!important;background:#fff!important}.paper{margin:0!important;box-shadow:none!important}.paper .parties{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:24px!important;break-inside:avoid!important}.paper .parties .from{text-align:left!important}'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one print CSS target, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Verify and build
        shell: bash
        run: |
          grep -n "paper .parties{display:grid!important" app/next-workspace/documents/DocumentViewer.tsx
          npm install
          npm run build

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-print-parties-fix.yml
          git add app/next-workspace/documents/DocumentViewer.tsx .github/workflows/one-time-print-parties-fix.yml
          git diff --cached --check
          git commit -m "fix: keep bill-to and from side by side in print"
          git push