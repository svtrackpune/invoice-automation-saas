name: Moneymatters build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply invoice visual and GST patch
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[invoice-visual-gstin]') }}
        run: |
          python3 scripts/patch_invoice_visual_gstin.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/next-workspace/documents/DocumentViewer.tsx app/document-templates.css
          if git diff --cached --quiet; then
            echo "Invoice visual/GST patch already present; nothing to commit."
          else
            git commit -m "Apply invoice color pattern and GST visibility [invoice-visual-gstin]"
            git push
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Final verification build for the approved invoice print structure.
