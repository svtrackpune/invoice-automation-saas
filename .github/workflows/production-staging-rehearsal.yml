name: Production staging rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_BUSINESS_ID: ${{ secrets.E2E_BUSINESS_ID }}
      E2E_PRODUCT_ID: ${{ secrets.E2E_PRODUCT_ID }}
      E2E_CASH_ACCOUNT_ID: ${{ secrets.E2E_CASH_ACCOUNT_ID }}
      E2E_SECOND_USER_EMAIL: ${{ secrets.E2E_SECOND_USER_EMAIL }}
      E2E_SECOND_USER_PASSWORD: ${{ secrets.E2E_SECOND_USER_PASSWORD }}
      E2E_SECOND_BUSINESS_ID: ${{ secrets.E2E_SECOND_BUSINESS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required staging configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_USER_EMAIL E2E_USER_PASSWORD E2E_BUSINESS_ID E2E_PRODUCT_ID E2E_CASH_ACCOUNT_ID; do
            test -n "${!name}" || { echo "Missing required staging secret: $name"; exit 1; }
          done

      - name: Run authenticated financial rehearsal
        run: npm run test:production-smoke
