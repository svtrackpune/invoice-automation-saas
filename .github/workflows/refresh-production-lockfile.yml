name: Refresh production-ready lockfile

on:
  push:
    branches:
      - production-ready-2026-10

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'svtrackpune'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:production-ready-2026-10
