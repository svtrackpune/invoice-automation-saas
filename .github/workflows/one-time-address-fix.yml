name: One-time address formatting fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-document-viewer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply address formatting fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/next-workspace/documents/DocumentViewer.tsx')
          source = path.read_text(encoding='utf-8')
          old = """    const first = [value.line1, value.address_line1, value.street, value.line2, value.address_line2].filter(Boolean).map(String).join(', ');\n    const second = [value.city, value.state, value.postal_code || value.pin || value.pincode, value.country].filter(Boolean).map(String).join(', ');\n    return [first, second].filter(Boolean);"""
          new = """    const first = [value.line1, value.address_line1, value.street].filter(Boolean).map(String).join(', ');\n    const second = [value.line2, value.address_line2].filter(Boolean).map(String).join(', ');\n    const third = [value.city, value.state, value.postal_code || value.pin || value.pincode].filter(Boolean).map(String).join(', ');\n    const fourth = [value.country].filter(Boolean).map(String).join(', ');\n    return [first, second, third, fourth].filter(Boolean);"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one address formatter block, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Verify structure-preserving change
        shell: bash
        run: |
          grep -n "const first = \[value.line1" app/next-workspace/documents/DocumentViewer.tsx
          grep -n "const fourth = \[value.country\]" app/next-workspace/documents/DocumentViewer.tsx
          test "$(grep -c "const fourth = \[value.country\]" app/next-workspace/documents/DocumentViewer.tsx)" -eq 1

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-address-fix.yml
          git add app/next-workspace/documents/DocumentViewer.tsx .github/workflows/one-time-address-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve document address line structure"
          git push