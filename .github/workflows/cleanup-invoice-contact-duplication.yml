name: One-time invoice contact cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicated customer contact fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/next-workspace/invoices/new/page.tsx')
          s = p.read_text()
          old = '{customer.email&&<div>{customer.email}</div>}{customer.website&&<div>{customer.website}</div>}{customer.email&&<div>{customer.email}</div>}{customer.website&&<div>{customer.website}</div>}'
          new = '{customer.email&&<div>{customer.email}</div>}{customer.website&&<div>{customer.website}</div>}'
          if old not in s:
              raise SystemExit('Expected duplicated customer contact block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/next-workspace/invoices/new/page.tsx .github/workflows/cleanup-invoice-contact-duplication.yml
          git rm .github/workflows/cleanup-invoice-contact-duplication.yml
          git commit -m 'Clean invoice customer contact block'
          git push