name: Moneymatters final quality pass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: python3 scripts/finish_quality_pass_v1.py
      - name: Commit quality pass changes
        run: |
          if git diff --quiet; then
            echo 'No additional quality changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/next-workspace/layout.tsx app/next-workspace/tax/page.tsx app/next-workspace/quotation/QuotationWorkspaceControlled.tsx app/next-workspace/invoices/new/page.tsx
          git commit -m 'Apply final core workflow quality improvements'
          git push
      - run: npm run build
