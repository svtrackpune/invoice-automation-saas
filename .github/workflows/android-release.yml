name: Android Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-release-aab:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node 24.18.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Android Release Signing Secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=("ANDROID_KEY_PASSWORD")

          if (("${#missing[@]}" > 0)); then
            printf '::error::Signed Android release halted. Missing repository Actions secrets:%s\n' "$(printf ' %s' "${missing[@]}")"
            echo "Configure the listed secrets in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          keystore_path="$temp_dir/release-signing.keystore"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-encode the production keystore and update the secret."
            exit 1
          fi
          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::Decoded Android release keystore is empty."
            exit 1
          fi

          if ! keystore_info="$(keytool -list -v -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null)"; then
            echo "::error::Release keystore validation failed. Verify the keystore bytes, store password, and key alias."
            exit 1
          fi
          if ! grep -q 'Entry type: PrivateKeyEntry' <<< "$keystore_info"; then
            echo "::error::Configured Android signing alias is not a private-key entry."
            exit 1
          fi

          echo "Android release secrets are present and the keystore contains the configured private-key alias."

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor Android project
        run: npm run cap:prepare && npx cap sync android

      - name: Generate Money Matters branding assets after Capacitor sync
        run: npm run branding:assets

      # Capacitor sync can rewrite generated Android Gradle files. Restore the
      # reviewed SDK declarations from this verified commit before building.
      - name: Preserve checked-in Android SDK configuration
        run: |
          git checkout -- android/app/build.gradle android/variables.gradle
          grep -Fq 'compileSdk 36' android/app/build.gradle
          grep -Fq 'compileSdkVersion = 36' android/variables.gradle
          grep -Fq 'targetSdkVersion = 36' android/variables.gradle

      - name: Build signed production AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PrequireReleaseSigning=true

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymatters-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
