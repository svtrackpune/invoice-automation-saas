name: One-time tax render enrichment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('app/next-workspace/documents/DocumentViewer.tsx')
          s=p.read_text(encoding='utf-8')
          old="const taxed = !receipt && Number(payload.tax_total) > 0;"
          new="const taxed = !receipt && Number(payload.tax_total) > 0;"
          if s.count(old)!=1: raise SystemExit('taxed anchor missing')
          old2="{taxed && <td>{item.tax_rate ?? 0}%{Number(item.tax_amount) > 0 && <small>{money(item.tax_amount, payload.currency_code)}</small>}</td>}"
          new2="{taxed && <td>{text(item.tax_rate_name || (item.tax_rate ? `${item.tax_rate}%` : 'Tax'))}{Array.isArray(item.tax_components) && item.tax_components.length ? <small>{item.tax_components.map((c:any)=>`${text(c.name)} ${Number(c.rate||0)}%`).join(' + ')}</small> : Number(item.tax_amount) > 0 && <small>{money(item.tax_amount, payload.currency_code)}</small>}</td>}"
          if s.count(old2)!=1: raise SystemExit(f'line tax cell anchor count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          old3="const payload = loaded.data?.payload || {}, businessId = payload.business?.id || payload.business_id;"
          new3="const payload = loaded.data?.payload || {}, businessId = payload.business?.id || payload.business_id;\n      const taxIds = Array.from(new Set((payload.items || []).map((x:any) => x.tax_rate_id).filter(Boolean)));\n      if (taxIds.length) { const taxRows = await supabase.from('tax_rates').select('id,name,rate,metadata').in('id', taxIds); if (!taxRows.error) payload.items = (payload.items || []).map((x:any) => { const t = (taxRows.data || []).find((r:any) => r.id === x.tax_rate_id); return t ? { ...x, tax_rate_name: t.name, tax_rate: t.rate, tax_components: Array.isArray(t.metadata?.components) ? t.metadata.components : [] } : x; }); }"
          if s.count(old3)!=1: raise SystemExit(f'payload anchor count={s.count(old3)}')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-time-tax-render-enrichment.yml').unlink()
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/next-workspace/documents/DocumentViewer.tsx .github/workflows/one-time-tax-render-enrichment.yml
          git diff --cached --check
          git commit -m "feat: render configured tax profile names"
          git push
