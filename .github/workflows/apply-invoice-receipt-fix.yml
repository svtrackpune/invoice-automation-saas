name: apply invoice receipt fixes
on:
  push:
    branches: [feature/receipt-render-and-invoice-status]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receipt-render-and-invoice-status
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/next-workspace/invoices/new/page.tsx')
          s=p.read_text(encoding='utf-8')
          old="if(!editId&&template)await supabase.from('invoices').update({template_id:template}).eq('id',r.data);location.href=`/next-workspace/documents?type=invoice&id=${r.data}`;"
          new="if(!editId){if(template)await supabase.from('invoices').update({template_id:template}).eq('id',r.data);const posted=await supabase.rpc('post_invoice',{p_invoice_id:r.data,p_location_id:null});if(posted.error){setError(posted.error.message);setBusy(false);return}}location.href=`/next-workspace/documents?type=invoice&id=${r.data}`;"
          if old in s:
              s=s.replace(old,new,1)
          elif "supabase.rpc('post_invoice',{p_invoice_id:r.data,p_location_id:null})" in s:
              print('invoice posting patch already applied')
          else:
              raise SystemExit('invoice save redirect block not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/next-workspace/invoices/new/page.tsx
          git diff --cached --quiet || git commit -m 'fix: post new invoices as sent'
          git push origin feature/receipt-render-and-invoice-status
