name: Android Native Build

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/android-native-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.18.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 6 toolchain
        run: npm install --no-save --package-lock=false --ignore-scripts --save-exact @capacitor/core@6.2.2 @capacitor/android@6.2.2 @capacitor/cli@6.2.2

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
