name: Android Native Build

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/android-native-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain
        run: npm install --no-save --package-lock=false --ignore-scripts --save-exact @capacitor/core@8.5.3 @capacitor/android@8.5.3 @capacitor/cli@8.5.3

      - name: Sync Android project
        run: npx cap sync android

      - name: Generate Money Matters branding assets after Capacitor sync
        run: npm run branding:assets

      # Capacitor sync can rewrite generated Android Gradle files. Restore the
      # reviewed API 36 declarations from this verified commit before building.
      - name: Preserve checked-in Android SDK configuration
        run: |
          git checkout -- android/app/build.gradle android/variables.gradle
          grep -Fq 'compileSdk 36' android/app/build.gradle
          grep -Fq 'compileSdkVersion = 36' android/variables.gradle
          grep -Fq 'targetSdkVersion = 36' android/variables.gradle

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: moneymatters-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for signing validation
        uses: actions/upload-artifact@v7
        with:
          name: moneymatters-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
