name: Maintenance - Sync Lockfile Metadata

on:
  push:
    branches:
      - maintenance/sync-lockfile-version

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Synchronize package-lock metadata
        run: npm install --package-lock-only

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package-lock version metadata"
          git push

# One-time maintenance synchronization for GA v1.0.0 metadata.
