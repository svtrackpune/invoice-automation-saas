name: Apply invoice payment enhancements
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch invoice renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/next-workspace/documents/DocumentViewer.tsx')
          s = p.read_text()

          s = s.replace("import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport QRCode from 'qrcode';", 1)

          old = '''function PaymentSection({ paymentMode, paymentLink, paymentSelection, balance, currency, premium = false }: any) {
  if (paymentMode === 'bank' && paymentSelection?.bank) return <section className={`payment bank-payment ${premium ? 'payment-premium' : ''}`}><BankDetails bank={paymentSelection.bank} /></section>;
  if (paymentMode === 'online') return <section className={`payment online-payment ${premium ? 'payment-premium' : ''}`}><div><label>PAYMENT OPTIONS</label><strong>Pay this invoice easily</strong><span>Amount due: {money(balance, currency)}</span>{paymentLink ? <a className="pay-link" href={paymentLink} target="_blank" rel="noreferrer">Pay Now</a> : <span>Payment link is being prepared.</span>}</div><div className="qr"><span>QR</span><small>Scan to pay</small></div></section>;
  return null;
}'''
          new = '''function PaymentSection({ paymentMode, paymentLink, paymentSelection, balance, currency, premium = false, showBankDetails = false, showPaymentLink = true, showPaymentQr = true, qrDataUrl = '' }: any) {
  const hasBank = showBankDetails && !!paymentSelection?.bank;
  const hasOnline = paymentMode === 'online' && (showPaymentLink || (showPaymentQr && !!qrDataUrl));
  if (!hasBank && !hasOnline) return null;
  return <section className={`payment ${hasBank && hasOnline ? 'payment-combined' : hasBank ? 'bank-payment' : 'online-payment'} ${premium ? 'payment-premium' : ''}`}>
    {hasBank && <div className="bank-payment-column"><BankDetails bank={paymentSelection.bank} /></div>}
    {hasOnline && <div className="online-payment-column"><div><label>PAYMENT OPTIONS</label><strong>Pay this invoice easily</strong><span>Amount due: {money(balance, currency)}</span>{showPaymentLink && paymentLink ? <a className="pay-link" href={paymentLink} target="_blank" rel="noreferrer">Pay Now</a> : showPaymentLink ? <span>Payment link is being prepared.</span> : null}</div>{showPaymentQr && qrDataUrl ? <div className="qr"><img src={qrDataUrl} alt="Scan to pay" /><small>Scan to pay</small></div> : null}</div>}
  </section>;
}'''
          if old not in s:
              raise SystemExit('PaymentSection target not found')
          s = s.replace(old, new, 1)

          s = s.replace("function BankDetails({ bank }: { bank: any }) {\n  const metadata = bank?.metadata || {};", "function BankDetails({ bank }: { bank: any }) {\n  const metadata = bank?.metadata || {};", 1)
          s = s.replace("{upi && <span>UPI: {text(upi)}</span>}", "{upi && <span>UPI: {text(upi)}</span>}{bank?.account_holder_name && <span>Account holder: {text(bank.account_holder_name)}</span>}", 1)

          s = s.replace("function Paper({ type, payload, business, customer, items, theme, fields, total, balance, received, logoUrl, paymentSelection }: any) {", "function Paper({ type, payload, business, customer, items, theme, fields, total, balance, received, logoUrl, paymentSelection, paymentQrDataUrl, showBankDetails, showPaymentLink, showPaymentQr }: any) {", 1)

          old_call = """    {(type === 'invoice' || paymentSelection?.bank) && <PaymentSection paymentMode={type === 'invoice' ? paymentMode : 'bank'} paymentLink={paymentLink} paymentSelection={paymentSelection} balance={balance} currency={payload.currency_code} premium={theme.className === 'template-premium'} />}"""
          new_call = """    {(type === 'invoice' || paymentSelection?.bank) && <PaymentSection paymentMode={type === 'invoice' ? paymentMode : 'bank'} paymentLink={paymentLink} paymentSelection={paymentSelection} balance={balance} currency={payload.currency_code} premium={theme.className === 'template-premium'} showBankDetails={showBankDetails} showPaymentLink={showPaymentLink} showPaymentQr={showPaymentQr} qrDataUrl={paymentQrDataUrl} />}"""
          if old_call not in s:
              raise SystemExit('Paper payment call target not found')
          s = s.replace(old_call, new_call, 1)

          s = s.replace("const [job, setJob] = useState<any>(null), [template, setTemplate] = useState<any>(null), [preferences, setPreferences] = useState<any>(null), [business, setBusiness] = useState<any>(null), [receiptItems, setReceiptItems] = useState<any[]>([]), [paymentSelection, setPaymentSelection] = useState<any>(null), [loading, setLoading] = useState(true), [error, setError] = useState(''), [notice, setNotice] = useState(''), [menu, setMenu] = useState(false);", "const [job, setJob] = useState<any>(null), [template, setTemplate] = useState<any>(null), [preferences, setPreferences] = useState<any>(null), [business, setBusiness] = useState<any>(null), [receiptItems, setReceiptItems] = useState<any[]>([]), [paymentSelection, setPaymentSelection] = useState<any>(null), [paymentQrDataUrl, setPaymentQrDataUrl] = useState(''), [loading, setLoading] = useState(true), [error, setError] = useState(''), [notice, setNotice] = useState(''), [menu, setMenu] = useState(false);", 1)

          marker = "  const model = job?.payload || {};"
          qr_effect = """  useEffect(() => {
    let active = true;
    const value = text(paymentSelection?.payment_qr_payload || model.payment_qr_payload || paymentSelection?.payment_link || model.payment_link || '');
    if (!value) { setPaymentQrDataUrl(''); return () => { active = false; }; }
    QRCode.toDataURL(value, { width: 180, margin: 1, errorCorrectionLevel: 'M' }).then((url) => { if (active) setPaymentQrDataUrl(url); }).catch(() => { if (active) setPaymentQrDataUrl(''); });
    return () => { active = false; };
  }, [paymentSelection, job]);

"""
          if marker not in s:
              raise SystemExit('model marker not found')
          s = s.replace(marker, qr_effect + marker, 1)

          old_paper = "<Paper type={type} payload={{ ...model, ...(paymentSelection ? { payment_link: paymentSelection.payment_link || model.payment_link, payment_qr_payload: paymentSelection.payment_qr_payload || model.payment_qr_payload } : {}) }} business={mergedBusiness} customer={customer} items={items} theme={theme} fields={fields} total={total} balance={balance} received={received} logoUrl={logoUrl} paymentSelection={paymentSelection} />"
          new_paper = "<Paper type={type} payload={{ ...model, ...(paymentSelection ? { payment_link: paymentSelection.payment_link || model.payment_link, payment_qr_payload: paymentSelection.payment_qr_payload || model.payment_qr_payload } : {}) }} business={mergedBusiness} customer={customer} items={items} theme={theme} fields={fields} total={total} balance={balance} received={received} logoUrl={logoUrl} paymentSelection={paymentSelection} paymentQrDataUrl={paymentQrDataUrl} showBankDetails={preferences?.show_bank_details === true} showPaymentLink={preferences?.show_payment_link !== false} showPaymentQr={preferences?.show_payment_qr !== false} />"
          if old_paper not in s:
              raise SystemExit('Paper invocation target not found')
          s = s.replace(old_paper, new_paper, 1)

          old_css = ".payment{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:#fafafa;font-size:14px}.payment label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}.payment strong,.payment span{display:block;margin-top:5px}.payment .pay-link{display:inline-block;margin-top:9px;border-radius:5px;padding:8px 14px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.qr{width:78px;height:78px;border:1px dashed var(--accent);border-radius:8px;display:grid;place-items:center;color:var(--accent);font-weight:900;flex:0 0 auto}.qr small{font-size:11px;font-weight:500}.bank-payment{display:block}.bank-details label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}.bank-details strong,.bank-details span{display:block;margin-top:5px}.bank-details strong{font-size:14px;color:#172033}.paper footer"
          new_css = ".payment{display:flex;justify-content:space-between;align-items:stretch;gap:20px;margin-top:22px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:#fafafa;font-size:14px}.payment label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}.payment strong,.payment span{display:block;margin-top:5px}.payment .pay-link{display:inline-block;margin-top:9px;border-radius:5px;padding:8px 14px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.payment-combined{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bank-payment-column{min-width:0}.online-payment-column{display:flex;justify-content:space-between;align-items:center;gap:16px;min-width:0}.qr{width:88px;height:88px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;flex:0 0 auto;padding:5px}.qr img{width:68px;height:68px;object-fit:contain}.qr small{font-size:9px;font-weight:700;color:#64748b;margin-top:2px}.bank-payment{display:block}.bank-details label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}.bank-details strong,.bank-details span{display:block;margin-top:5px}.bank-details strong{font-size:14px;color:#172033}.paper footer"
          if old_css not in s:
              raise SystemExit('payment CSS target not found')
          s = s.replace(old_css, new_css, 1)

          p.write_text(s)
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/next-workspace/documents/DocumentViewer.tsx .github/workflows/apply-invoice-payment-enhancements.yml
          git commit -m "Improve invoice bank details and online payment display"
          git rm .github/workflows/apply-invoice-payment-enhancements.yml
          git commit -m "Remove temporary invoice enhancement workflow"
          git push