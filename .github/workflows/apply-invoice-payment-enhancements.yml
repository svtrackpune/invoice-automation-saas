name: Apply invoice payment and invoice structure enhancements
on:
  push:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch invoice renderer and template CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/next-workspace/documents/DocumentViewer.tsx')
          s = p.read_text(encoding='utf-8')

          if "import QRCode from 'qrcode';" not in s:
              anchor = "import { supabase } from '@/lib/supabase';"
              if anchor not in s:
                  raise SystemExit('Supabase import anchor not found')
              s = s.replace(anchor, anchor + "\nimport QRCode from 'qrcode';", 1)

          payment_pattern = r"function PaymentSection\([\s\S]*?\n\}\n\nfunction Paper"
          payment_replacement = '''function PaymentSection({ paymentMode, paymentLink, paymentSelection, balance, currency, premium = false, showBankDetails = false, showPaymentLink = true, showPaymentQr = true, qrDataUrl = '' }: any) {
  const hasBank = showBankDetails && !!paymentSelection?.bank;
  const hasOnline = paymentMode === 'online' && (showPaymentLink || (showPaymentQr && !!qrDataUrl));
  if (!hasBank && !hasOnline) return null;
  return <section className={`payment ${hasBank && hasOnline ? 'payment-combined' : hasBank ? 'bank-payment' : 'online-payment'} ${premium ? 'payment-premium' : ''}`}>
    {hasBank && <div className="bank-payment-column"><BankDetails bank={paymentSelection.bank} /></div>}
    {hasOnline && <div className="online-payment-column"><div><label>PAYMENT OPTIONS</label><strong>Pay this invoice easily</strong><span>Amount due: {money(balance, currency)}</span>{showPaymentLink && paymentLink ? <a className="pay-link" href={paymentLink} target="_blank" rel="noreferrer">Pay Now</a> : showPaymentLink ? <span>Payment link is being prepared.</span> : null}</div>{showPaymentQr && qrDataUrl ? <div className="qr"><img src={qrDataUrl} alt="Scan to pay" /><small>Scan to pay</small></div> : null}</div>}
  </section>;
}

function Paper'''
          s, n = re.subn(payment_pattern, payment_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'PaymentSection replacement count: {n}')

          holder_old = "{upi && <span>UPI: {text(upi)}</span>}"
          holder_new = "{upi && <span>UPI: {text(upi)}</span>}{bank?.account_holder_name && <span>Account holder: {text(bank.account_holder_name)}</span>}"
          if holder_old in s and holder_new not in s:
              s = s.replace(holder_old, holder_new, 1)

          paper_sig = "function Paper({ type, payload, business, customer, items, theme, fields, total, balance, received, logoUrl, paymentSelection }: any) {"
          paper_sig_new = "function Paper({ type, payload, business, customer, items, theme, fields, total, balance, received, logoUrl, paymentSelection, paymentQrDataUrl, showBankDetails, showPaymentLink, showPaymentQr }: any) {"
          if paper_sig in s:
              s = s.replace(paper_sig, paper_sig_new, 1)

          state_old = "const [job, setJob] = useState<any>(null), [template, setTemplate] = useState<any>(null), [preferences, setPreferences] = useState<any>(null), [business, setBusiness] = useState<any>(null), [receiptItems, setReceiptItems] = useState<any[]>([]), [paymentSelection, setPaymentSelection] = useState<any>(null), [loading, setLoading] = useState(true), [error, setError] = useState(''), [notice, setNotice] = useState(''), [menu, setMenu] = useState(false);"
          state_new = "const [job, setJob] = useState<any>(null), [template, setTemplate] = useState<any>(null), [preferences, setPreferences] = useState<any>(null), [business, setBusiness] = useState<any>(null), [receiptItems, setReceiptItems] = useState<any[]>([]), [paymentSelection, setPaymentSelection] = useState<any>(null), [paymentQrDataUrl, setPaymentQrDataUrl] = useState(''), [loading, setLoading] = useState(true), [error, setError] = useState(''), [notice, setNotice] = useState(''), [menu, setMenu] = useState(false);"
          if state_old in s:
              s = s.replace(state_old, state_new, 1)

          marker = "  const model = job?.payload || {};"
          if marker in s and "QRCode.toDataURL" not in s:
              qr_effect = '''  useEffect(() => {
    let active = true;
    const value = text(paymentSelection?.payment_qr_payload || job?.payload?.payment_qr_payload || paymentSelection?.payment_link || job?.payload?.payment_link || '');
    if (!value) { setPaymentQrDataUrl(''); return () => { active = false; }; }
    QRCode.toDataURL(value, { width: 180, margin: 1, errorCorrectionLevel: 'M' }).then((url) => { if (active) setPaymentQrDataUrl(url); }).catch(() => { if (active) setPaymentQrDataUrl(''); });
    return () => { active = false; };
  }, [paymentSelection, job]);

'''
              s = s.replace(marker, qr_effect + marker, 1)

          old_paper = "<Paper type={type} payload={{ ...model, ...(paymentSelection ? { payment_link: paymentSelection.payment_link || model.payment_link, payment_qr_payload: paymentSelection.payment_qr_payload || model.payment_qr_payload } : {}) }} business={mergedBusiness} customer={customer} items={items} theme={theme} fields={fields} total={total} balance={balance} received={received} logoUrl={logoUrl} paymentSelection={paymentSelection} />"
          new_paper = "<Paper type={type} payload={{ ...model, ...(paymentSelection ? { payment_link: paymentSelection.payment_link || model.payment_link, payment_qr_payload: paymentSelection.payment_qr_payload || model.payment_qr_payload } : {}) }} business={mergedBusiness} customer={customer} items={items} theme={theme} fields={fields} total={total} balance={balance} received={received} logoUrl={logoUrl} paymentSelection={paymentSelection} paymentQrDataUrl={paymentQrDataUrl} showBankDetails={preferences?.show_bank_details === true} showPaymentLink={preferences?.show_payment_link !== false} showPaymentQr={preferences?.show_payment_qr !== false} />"
          if old_paper not in s:
              raise SystemExit('Paper invocation target not found')
          s = s.replace(old_paper, new_paper, 1)
          p.write_text(s, encoding='utf-8')

          css = Path('app/document-templates.css')
          cs = css.read_text(encoding='utf-8')
          marker_css = '/* Moneymatters locked invoice composition v1 */'
          if marker_css not in cs:
              cs += '''\n\n/* Moneymatters locked invoice composition v1 */
.paper:not(.receipt-paper) .document-header { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(220px,280px) !important; gap:28px !important; align-items:start !important; }
.paper:not(.receipt-paper) .business-identity { display:flex !important; align-items:flex-start !important; min-width:0 !important; }
.paper:not(.receipt-paper) .logo { width:120px !important; height:92px !important; flex:0 0 120px !important; }
.paper:not(.receipt-paper) .logo img { max-width:110px !important; max-height:82px !important; object-fit:contain !important; }
.paper:not(.receipt-paper) .business-brand-copy,.paper:not(.receipt-paper) .heading { min-width:0 !important; }
.paper:not(.receipt-paper) .heading { text-align:right !important; }
.paper:not(.receipt-paper) .tagline,.paper:not(.receipt-paper) .parties strong,.paper:not(.receipt-paper) .parties span,.paper:not(.receipt-paper) footer,.paper:not(.receipt-paper) .platform { overflow-wrap:anywhere !important; word-break:break-word !important; }
.paper:not(.receipt-paper) .parties { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important; gap:18px !important; }
.paper:not(.receipt-paper) .parties > div { min-width:0 !important; overflow:hidden !important; }
.paper:not(.receipt-paper) .items { width:100% !important; table-layout:fixed !important; }
.paper:not(.receipt-paper) .items th,.paper:not(.receipt-paper) .items td { overflow-wrap:anywhere !important; word-break:break-word !important; }
.paper:not(.receipt-paper) .items th:first-child,.paper:not(.receipt-paper) .items td:first-child { width:46% !important; }
.paper:not(.receipt-paper) .body-grid { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(250px,300px) !important; gap:28px !important; align-items:start !important; }
.paper:not(.receipt-paper) .totalwrap { grid-column:2 !important; width:100% !important; justify-self:stretch !important; }
.paper:not(.receipt-paper) .totals { width:100% !important; margin-left:auto !important; }
.paper:not(.receipt-paper) .payment-combined { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important; gap:20px !important; align-items:stretch !important; }
.paper:not(.receipt-paper) .bank-payment-column { min-width:0 !important; padding-right:20px !important; border-right:1px solid var(--line) !important; }
.paper:not(.receipt-paper) .online-payment-column { min-width:0 !important; }
.paper:not(.receipt-paper) .payment .qr { width:92px !important; height:92px !important; flex:0 0 92px !important; display:flex !important; flex-direction:column !important; align-items:center !important; justify-content:center !important; background:#fff !important; border:1px solid var(--line) !important; }
.paper:not(.receipt-paper) .payment .qr img { width:72px !important; height:72px !important; object-fit:contain !important; }
@media print { .paper:not(.receipt-paper) .document-header { grid-template-columns:minmax(0,1fr) minmax(220px,280px) !important; } .paper:not(.receipt-paper) .parties { grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important; } .paper:not(.receipt-paper) .body-grid { grid-template-columns:minmax(0,1fr) minmax(250px,300px) !important; } }
'''
              css.write_text(cs, encoding='utf-8')

          Path('/tmp/patched').write_text('yes')
      - name: Verify and commit
        if: always()
        run: |
          if [ -f /tmp/patched ]; then
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/next-workspace/documents/DocumentViewer.tsx app/document-templates.css
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lock invoice composition and payment panel [invoice-patch]"
            git push
          fi