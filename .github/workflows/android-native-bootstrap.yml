name: Initialize Android Native Platform

on:
  push:
    branches:
      - main
    paths:
      - capacitor.config.ts
      - package.json
      - .github/workflows/android-native-bootstrap.yml

permissions:
  contents: write

jobs:
  initialize:
    if: ${{ !hashFiles('android/**') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24.18.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor 6 toolchain
        run: npm install --no-save --package-lock=false --ignore-scripts --save-exact @capacitor/core@6.2.2 @capacitor/android@6.2.2 @capacitor/cli@6.2.2
      - name: Generate Android platform
        run: npx cap add android
      - name: Configure Android hardware permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permissions = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
          """
          marker = "    <uses-permission android:name=\"android.permission.CAMERA\" />"
          if marker not in text:
              text = text.replace("<application", permissions + "\n    <application", 1)
          path.write_text(text)
          PY
      - name: Verify native Android debug build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Commit generated Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "build: initialize native Android platform" || exit 0
          git push origin main
