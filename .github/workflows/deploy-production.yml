name: Deploy Production (Plesk / mm.nilanga.in)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Validate Deployment Secrets
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_USER" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "::error::Missing deployment secrets in GitHub. Please configure PROD_SSH_HOST, PROD_SSH_USER, and PROD_SSH_KEY under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Execute Remote Deployment & Rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/vhosts/nilanga.in/mm.nilanga.in
            git fetch origin main
            git reset --hard origin/main
            rm -rf .next
            npm ci --prefer-offline --no-audit
            npm run build
            mkdir -p tmp && touch tmp/restart.txt

      - name: Verify Live Endpoints
        run: |
          sleep 10
          curl -f -sS --max-time 10 https://mm.nilanga.in/healthz | grep -q '"status":"healthy"'
          curl -f -sS --max-time 15 https://mm.nilanga.in/readyz | grep -q '"database":"connected"'
