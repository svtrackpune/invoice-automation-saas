name: Plesk Deployment (Manual Only — No SSH)

# Production is updated manually from Plesk. This workflow must never SSH to
# production or deploy automatically after CI; it is only a reminder when
# explicitly dispatched by an operator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-only:
    name: Manual Plesk deployment reminder (does not deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Show manual deployment instructions
        shell: bash
        run: |
          {
            echo "## Manual Plesk deployment required"
            echo
            echo "**No deployment was performed by this workflow.** No SSH connection"
            echo "was attempted and no production files were changed."
            echo
            echo "Use the existing manual Plesk procedure to pull the intended commit"
            echo "from main, then rebuild/restart using the established Plesk process."
            echo
            echo "Before pulling, confirm the corresponding CI run has passed:"
            echo "https://github.com/svtrackpune/invoice-automation-saas/actions/workflows/ci.yml"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Manual Plesk deployment is operator-managed; this workflow does not deploy."
