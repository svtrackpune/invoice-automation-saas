name: Deploy Production (Plesk / mm.nilanga.in)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
    steps:
      - name: Validate Deployment Secrets
        id: preflight
        run: |
          if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_USER" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "::warning::Plesk deployment skipped because PROD_SSH_HOST, PROD_SSH_USER, or PROD_SSH_KEY is not configured."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Execute Remote Deployment & Rebuild
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PROD_SSH_HOST }}
          username: ${{ env.PROD_SSH_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          port: ${{ env.PROD_SSH_PORT }}
          ssh_args: "-o StrictHostKeyChecking=no"
          script: |
            set -e
            cd /var/www/vhosts/nilanga.in/mm.nilanga.in
            TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "Deploying verified commit: $TARGET_SHA"
            git fetch origin "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            rm -rf .next
            npm ci --prefer-offline --no-audit
            npm run build
            mkdir -p tmp && touch tmp/restart.txt

      - name: Verify Live Endpoints
        if: steps.preflight.outputs.deploy_enabled == 'true'
        run: |
          sleep 10
          curl -f -sS --max-time 10 https://mm.nilanga.in/healthz | grep -q '"status":"healthy"'
          curl -f -sS --max-time 15 https://mm.nilanga.in/readyz | grep -q '"database":"connected"'
