name: Deploy Production (Plesk / mm.nilanga.in)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
    steps:
      - name: Validate Deployment Secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${PROD_SSH_HOST:-}" ]] || missing+=("PROD_SSH_HOST")
          [[ -n "${PROD_SSH_USER:-}" ]] || missing+=("PROD_SSH_USER")
          [[ -n "${PROD_SSH_KEY:-}" ]] || missing+=("PROD_SSH_KEY")

          if (("${#missing[@]}" > 0)); then
            printf '::error::Deployment halted. Missing repository Actions secrets:%s\n' "$(printf ' %s' "${missing[@]}")"
            echo "Configure the listed secrets in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [[ ! "${PROD_SSH_PORT:-}" =~ ^[0-9]+$ ]] || (( PROD_SSH_PORT < 1 || PROD_SSH_PORT > 65535 )); then
            echo "::error::PROD_SSH_PORT must be an integer between 1 and 65535 (or leave it unset to use port 22)."
            exit 1
          fi

          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Execute Remote Deployment & Rebuild
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ env.PROD_SSH_HOST }}
          username: ${{ env.PROD_SSH_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          port: ${{ env.PROD_SSH_PORT }}
          ssh_args: "-o StrictHostKeyChecking=no"
          script: |
            set -eu
            cd /var/www/vhosts/nilanga.in/mm.nilanga.in
            TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            if ! printf '%s\n' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}
            echo "Deploying verified commit: $TARGET_SHA"
            git fetch origin "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            rm -rf .next
            npm ci --prefer-offline --no-audit
            npm run build
            mkdir -p tmp && touch tmp/restart.txt

      - name: Verify Live Endpoints
        if: steps.preflight.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          curl -f -sS --max-time 10 https://mm.nilanga.in/healthz | grep -q '"status":"healthy"'
          curl -f -sS --max-time 15 https://mm.nilanga.in/readyz | grep -q '"database":"connected"'
; then
              echo "Refusing deployment: invalid target commit SHA."
              exit 1
            fi
            echo "Deploying verified commit: $TARGET_SHA"
            git fetch origin "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            rm -rf .next
            npm ci --prefer-offline --no-audit
            npm run build
            mkdir -p tmp && touch tmp/restart.txt

      - name: Verify Live Endpoints
        if: steps.preflight.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          curl -f -sS --max-time 10 https://mm.nilanga.in/healthz | grep -q '"status":"healthy"'
          curl -f -sS --max-time 15 https://mm.nilanga.in/readyz | grep -q '"database":"connected"'
